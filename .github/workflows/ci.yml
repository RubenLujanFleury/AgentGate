name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Import rules
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest
