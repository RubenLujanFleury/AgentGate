[project]
name = "agentgate"
version = "0.1.0"
description = "An LLM gateway with routing, resilience, and evals."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter",
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_packages = ["agentgate"]
include_external_packages = true

# Rules from gateway-plan.md section 6B. import-linter errors on a module that
# doesn't exist yet, so each contract is added in the week its modules arrive:
#   W2: backends, storage, gateway   W4: routing   W5: runtime   W6: evals   W7: rag
# W1 has only config and api.

[[tool.importlinter.contracts]]
name = "config stays free of the web framework and the HTTP layer"
type = "forbidden"
source_modules = ["agentgate.config"]
forbidden_modules = ["fastapi", "agentgate.api"]
